name: Update chatbot knowledge base

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-knowledge-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # No AWS credentials needed: the generator pulls the roster from the
      # deployed site's /api/team endpoint, projects from the public GitHub
      # org, and events directly from Meetup. GITHUB_TOKEN just lifts the
      # GitHub API rate limit; MEETUP_API_TOKEN is the persisted-query hash
      # for Meetup events; KB_SITE_URL overrides which deployment to read.
      - name: Generate knowledge base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEETUP_API_TOKEN: ${{ secrets.MEETUP_API_TOKEN }}
        run: npx tsx scripts/generate-knowledge-base.ts

      # No [skip ci] tag: this workflow only runs on schedule/dispatch (never on
      # push), so there is no self-trigger loop to prevent — and crucially,
      # Vercel skips deployments whose commit message contains [skip ci], which
      # would leave the freshly generated knowledge base un-deployed. The
      # chatbot imports knowledge-base.json at build time, so the push must
      # trigger a Vercel rebuild for new data to actually go live.
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/knowledge-base.json
          git diff --staged --quiet || git commit -m "chore: refresh chatbot knowledge base"
          git push
